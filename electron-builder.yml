appId: com.billium
productName: Billium

directories:
  output: release


files:
  - dist-fe/**
  - dist-be/**
  - node_modules/**
  - package.json

extraMetadata:
  main: dist-be/backend/main/main.cjs

forceCodeSigning: false

win:
  target: nsis
  artifactName: Billium-Windows-Setup.${ext}

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false

mac:
  target: dmg
  artifactName: Billium-Mac-Installer.${ext}
  category: public.app-category.business

linux:
  target: AppImage
  artifactName: Billium-Linux.${ext}
  category: Office
